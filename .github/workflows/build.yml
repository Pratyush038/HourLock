name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:    # Lets you manually trigger from GitHub UI anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle         # Caches ~/.gradle between runs → much faster reruns

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        # --stacktrace gives detailed error output if the build fails
        # --no-daemon prevents the Gradle daemon from persisting across CI steps

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hourlock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # artifact expires after 7 days by default (GitHub free plan)
          retention-days: 7

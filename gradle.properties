# Project-wide Gradle settings — applies to all modules.

# AndroidX: MUST be true for all modern Jetpack (Compose, Lifecycle, DataStore, etc.)
# Without this flag, Gradle refuses to build when AndroidX libs are detected on the classpath.
android.useAndroidX=true

# Jetifier: Automatically migrates legacy Support Library dependencies to AndroidX.
# Needed if any transitive dependency still uses the old android.support.* namespace.
android.enableJetifier=true

# Kotlin code style: "official" matches Android Studio Hedgehog defaults
kotlin.code.style=official

# Enable configuration cache for faster incremental builds (Gradle 8.x feature)
org.gradle.configuration-cache=true

# Increase the JVM heap for the Gradle daemon — Compose + Kotlin symbol processing
# can be memory-hungry on the first full build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
